<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-16">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="shortcut icon" href="../favicon.ico" >
	<link href="../style.css" type="text/css" rel="stylesheet">
	<title>greg live</title>
	<style> 
		body { 
/*			background: radial-gradient(ellipse at right, #d0aad0, #fff9c4);*/
			height: 256px;
			background: radial-gradient(ellipse at right, #d0aad0, #fff9c4);
			background-size: 200% 100%;
			animation: shiftGradient 8s ease-in-out infinite;
		}

		@keyframes shiftGradient {
			0%   { background-position: 0% 50%; }
			50%  { background-position: 100% 50%; }
			100% { background-position: 0% 50%; }
		}

		/* move to oi later  */
		#live-table {
			width: 100%; 
			text-align: left;

			tr { display: flex; width: 100%; }
			th, td { min-width: 24px; text-align: right; }
			th:first-child { flex-grow: 1; text-align: left; }
			td:first-child { flex-grow: 1; text-align: left; }
			th:nth-child(2) { margin-left: auto; }
			td:nth-child(2) { margin-left: auto; }
		}

		/* idk */
		.toggle-check {
			zoom: unset !important;
		}
	
	</style>
</head>
<body>
	<div id="container"></div>
	<script src="./src/index.js" type="module"></script>
</body>
</html>
